# Settings for rpi-aws-kvs (/etc/rpi-aws-examples/kvs.conf). After a change: sudo systemctl restart rpi-aws-kvs
#
# The camera mode. 1280x720 at 30 frames per second suits every board. On a Pi 5 or CM5 the encoder is
# software, so a larger mode costs CPU: 1280x720 at 30 uses about a third of one core.
WIDTH=1280
HEIGHT=720
FRAMERATE=30
# H.264 bitrate, kbit/s.
BITRATE_KBPS=2000
# auto: the hardware encoder where the board has one (Pi 4, CM4, Zero 2 W), x264 in software otherwise
# (Pi 5, CM5). Or v4l2, or x264.
ENCODER=auto
